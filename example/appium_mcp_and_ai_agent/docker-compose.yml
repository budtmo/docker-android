services:
  android-emulator:
    image: budtmo2/docker-android-pro:emulator_16.0
    container_name: android-container
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      WEB_VNC: "true"
      APPIUM: "true"
    devices:
      - "/dev/kvm:/dev/kvm"
    ports:
      - "6080:6080"
    networks:
      - android-net
    restart: unless-stopped

  agent:
    image: budtmo2/docker-android-pro:agent
    environment:
      MCP_TYPE: appium
      APPIUM_SERVER_URL: http://android-emulator:4723
      APPIUM_UDID: emulator-5554
      # It could be http://local-llm:8000/v1 for vllm
      LLM_BASE_URL: http://local-llm:11434/v1
      # Leave it empty if it doesnt need any Bearer token
      LLM_API_KEY: ""
      # It could be Qwen/Qwen3.8:27B for vllm
      LLM_MODEL: qwen3.8:27b
      AGENT_MAX_TOOL_ITERATIONS: 6
      REQUEST_TIMEOUT_SECONDS: 60
    ports:
      - "8501:8501"
    depends_on:
      - android-emulator
    networks:
      - android-net
    extra_hosts:
      # Change with the ip where your local-llm is running (it could be ollama or vllm)
      - "local-llm:xx.xx.xx.xx"
    restart: unless-stopped

networks:
  android-net:
    driver: bridge
